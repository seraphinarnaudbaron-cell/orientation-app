name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses (SDK préinstallé sur le runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log; then
            python3 - <<'PY'
          import re
          lines = open("build.log", errors="replace").read().splitlines()
          def esc(t):
              return t.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          errs = [re.sub(r"file:///\S*/app/src/", "app/src/", l) for l in lines
                  if l.startswith("e: ") or "error:" in l or "What went wrong" in l or "Execution failed" in l]
          if not errs:
              errs = lines[-30:]
          print("::error title=Erreurs de compilation::" + esc("\n".join(errs[:30]))[:3500])
          PY
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orientation-jp-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
