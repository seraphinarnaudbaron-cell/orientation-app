name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          unzip \
          zip \
          libffi-dev \
          libssl-dev \
          python3-dev \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libtinfo5 \
          cmake
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade wheel setuptools
        pip install Cython==0.29.37
        pip install buildozer

    - name: Check Python syntax (fail fast)
      run: python -m py_compile main.py api.py config.py
    
    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-global-${{ hashFiles('buildozer.spec') }}-v5
        restore-keys: |
          buildozer-global-
    
    - name: Cache Buildozer directory in project
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: buildozer-project-${{ hashFiles('buildozer.spec') }}-v5
        restore-keys: |
          buildozer-project-
    
    - name: Build with Buildozer
      run: |
        set -o pipefail
        if ! buildozer android debug 2>&1 | tee build.log; then
          python3 - <<'PY'
        import re
        lines = open("build.log", errors="replace").read().splitlines()
        def esc(t):
            return t.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
        errs = [l for l in lines if re.search(r"error|failed|exception|not found|No such", l, re.I)][-25:]
        print("::error title=Build errors (filtered)::" + esc("\n".join(errs))[:3500])
        print("::error title=Build log tail::" + esc("\n".join(lines[-45:]))[:3500])
        PY
          exit 1
        fi
      env:
        BUILDOZER_LOG_LEVEL: 2
    
    - name: List generated files
      if: always()
      run: |
        echo "=== Contents of bin/ directory ==="
        ls -lah bin/ || echo "bin/ directory not found"
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: orientation-jp-debug
        path: bin/*.apk
        if-no-files-found: warn
    
    - name: Upload build logs on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: buildozer-logs
        path: |
          .buildozer/android/platform/build-*/
          build.log
